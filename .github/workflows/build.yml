name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: dotnet restore
        run: dotnet restore Dodo.Unique.slnx

      - name: dotnet build
        run: dotnet build Dodo.Unique.slnx -c Release --no-restore

      - name: run Dodo.Unique tests (excluding rotation stress)
        run: dotnet run --project tests/Dodo.Unique.Tests/Dodo.Unique.Tests.csproj -c Release --no-build -- --treenode-filter "/*/*/*/*[Category!=RotationStress]"
      - name: run Dodo.Unique.NewtonsoftJson tests
        run: dotnet run --project tests/Dodo.Unique.NewtonsoftJson.Tests/Dodo.Unique.NewtonsoftJson.Tests.csproj -c Release --no-build

  rotation-stress:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: dotnet build
        run: dotnet build tests/Dodo.Unique.Tests/Dodo.Unique.Tests.csproj -c Release

      - name: run rotation contention stress tests
        run: dotnet run --project tests/Dodo.Unique.Tests/Dodo.Unique.Tests.csproj -c Release --no-build -- --treenode-filter "/*/*/*/*[Category=RotationStress]"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    environment: nuget-org
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: dotnet pack
        run: |
          dotnet pack src/Dodo.Unique/Dodo.Unique.csproj -c Release -p:IsPackable=true --output nupkgs
          dotnet pack src/Dodo.Unique.NewtonsoftJson/Dodo.Unique.NewtonsoftJson.csproj -c Release -p:IsPackable=true --output nupkgs

      - name: NuGet trusted-publisher login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: dotnet nuget push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
