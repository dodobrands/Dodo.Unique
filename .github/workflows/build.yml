name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tfm:
          - net9.0
          - net10.0
          - net11.0
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: dotnet restore
        run: dotnet restore Dodo.Unique.slnx

      - name: dotnet build
        run: dotnet build Dodo.Unique.slnx -c Release --no-restore

      - name: run Dodo.Unique tests (excluding rotation stress)
        run: dotnet run --project tests/Dodo.Unique.Tests/Dodo.Unique.Tests.csproj -c Release --no-build -f ${{ matrix.tfm }} -- --treenode-filter "/*/*/*/*[Category!=RotationStress]"
      - name: run Dodo.Unique.NewtonsoftJson tests
        run: dotnet run --project tests/Dodo.Unique.NewtonsoftJson.Tests/Dodo.Unique.NewtonsoftJson.Tests.csproj -c Release --no-build -f ${{ matrix.tfm }}

  rotation-stress:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
        tfm:
          - net9.0
          - net10.0
          - net11.0
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: dotnet build
        run: dotnet build tests/Dodo.Unique.Tests/Dodo.Unique.Tests.csproj -c Release

      - name: run rotation stress + perf proofs
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project tests/Dodo.Unique.Tests/Dodo.Unique.Tests.csproj -c Release --no-build -f ${{ matrix.tfm }} -- --treenode-filter "/*/*/*/*[Category=RotationStress]" --output Detailed | tee stress-output.log

      - name: perf numbers to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Perf numbers (${{ matrix.runner }} / ${{ matrix.tfm }})"
            echo '```'
            grep -hE "\[(fence-bench|hit-bench|coldhit-bench|litmus|RotatingCallLatency|SealedRotationAllocation)" stress-output.log | sed 's/^[[:space:]]*//' | sort -u || echo "no perf lines captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    environment: nuget-org
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: dotnet pack
        run: |
          dotnet pack src/Dodo.Unique/Dodo.Unique.csproj -c Release -p:IsPackable=true --output nupkgs
          dotnet pack src/Dodo.Unique.NewtonsoftJson/Dodo.Unique.NewtonsoftJson.csproj -c Release -p:IsPackable=true --output nupkgs

      - name: NuGet trusted-publisher login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: dotnet nuget push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
